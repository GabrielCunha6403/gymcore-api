services:
  postgres:
    image: postgres:16-alpine
    container_name: gymcore-postgres
    environment:
      POSTGRES_DB: gymcore
      POSTGRES_USER: gymcore
      POSTGRES_PASSWORD: gymcore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymcore -d gymcore"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
